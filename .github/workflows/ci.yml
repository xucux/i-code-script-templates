name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate templates
        run: node scripts/validate.mjs

      - name: Build catalog.json
        run: node scripts/build-catalog.mjs

      - name: Check catalog.json content (ignore generatedAt)
        run: |
          # Compare catalog.json content excluding the generatedAt timestamp
          OLD=$(mktemp)
          NEW=$(mktemp)
          git show HEAD:catalog.json 2>/dev/null | grep -v '"generatedAt"' > "$OLD" || true
          grep -v '"generatedAt"' catalog.json > "$NEW"
          if ! diff -q "$OLD" "$NEW" > /dev/null 2>&1; then
            echo "❌ catalog.json is outdated or has changes beyond generatedAt"
            echo "Run 'node scripts/build-catalog.mjs' locally and commit the result"
            diff "$OLD" "$NEW"
            exit 1
          fi
          echo "✅ catalog.json is up to date"