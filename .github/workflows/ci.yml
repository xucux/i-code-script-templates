name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate templates
        run: node scripts/validate.mjs

      - name: Build catalog.json
        run: node scripts/build-catalog.mjs

      - name: Check catalog.json is up to date
        run: |
          git diff --exit-code catalog.json || {
            echo "❌ catalog.json is outdated — run 'node scripts/build-catalog.mjs' and commit the result"
            exit 1
          }